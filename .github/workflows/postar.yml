# Roda o agente nos servidores do GitHub.
# Quem chama no horário certo é o cron-job.org (9h, 12h, 15h, 19h e 21h de Brasília).
# Também dá pra rodar na mão: Actions > Postar achadinhos > Run workflow.
#
# Perfis no mesmo robô:
#   ingrid      -> grupo Achadinhos da Indy (segredos de sempre, arquivos na raiz). Posta só o que vocês aprovam.
#   blackfriday -> grupo Black Friday da Indy: o robô garimpa e o Yuri escolhe no painel.
#                  Segredos _BF, arquivos em perfis/blackfriday/.
#   geral       -> DESLIGADO por enquanto (o grupo que era "Achadinhos geral" virou o Black Friday).
#                  Pra religar um dia: troque LIGAR_GERAL pra "sim" lá embaixo.
#
# 05/11 - TESTE "UM POST POR HORA" (só no grupo Black Friday):
#   - Rodadas da BF de hora em hora, das 8h às 22h (5 do cron-job.org + 10 do GitHub aqui embaixo).
#   - Cada rodada solta só 1 post da fila. O resto espera a próxima hora.
#   - O botão "Enviar agora" do painel continua soltando até 5 de uma vez.
#   - O Achadinhos da Indy não muda nada.
#   - Pra desfazer: volte o schedule antigo e troque MAX_TOTAL_RODADA da BF pra "5".
#
# 06/11 - API da Shopee ligada (segredos SHOPEE_APP_ID e SHOPEE_SECRET).
#   A cada rodada o robô busca na Shopee algumas palavras pelos mais vendidos (SHOPEE_MAIS_VENDIDOS),
#   algumas pela maior comissão (SHOPEE_COMISSAO) e, na BF, os destaques da Shopee. Os achados vão pro painel.
#   Pra trocar o que ele busca: edite a linha PALAVRAS de cada perfil (separado por vírgula, entre aspas).
#
# 18/11 - PROGRAMAÇÃO QUE NÃO SOME:
#   - Cada programação tem um código (coluna fila_id no ofertas.csv). O "Guardar histórico" junta
#     a fila por esse código, não mais pelo link (o link juntava programação nova com post antigo).
#   - Novo campo "cancelar" (botão "Limpar programação" e "✕" do painel): "tudo" ou os códigos.
#   - "horario" aceita dia e hora: "2026-11-20T19".
#   - Mais palavras da Shopee no painel da Indy e da BF: por rodada, 4 pelos mais vendidos + 2 pela maior comissão.
name: Postar achadinhos

on:
  # Rodadas EXTRAS só do Black Friday (além das 5 do cron-job.org às 9, 12, 15, 19 e 21h):
  # 8h, 10h, 11h, 13h, 14h, 16h, 17h, 18h, 20h e 22h de Brasília, no minuto 5
  # (o GitHub usa horário UTC, +3h). O GitHub às vezes atrasa alguns minutos; é normal.
  # Nenhuma delas lê o grupo Eletro em Oferta (isso continua só nas rodadas do cron-job.org).
  schedule:
    - cron: "5 11,13,14,16,17,19,20,21,23 * * *"
    - cron: "5 1 * * *"
  workflow_dispatch:
    inputs:
      perfil:
        description: "Qual perfil rodar"
        type: choice
        options: [todos, ingrid, geral, blackfriday]
        default: todos
      # Formulário "Postar algo que vi" do painel e botões do catálogo (vai pro grupo do perfil escolhido)
      link:
        description: "Link do produto (opcional)"
        required: false
        default: ""
      nome:
        description: "Nome do produto"
        required: false
        default: ""
      preco:
        description: "Preço atual (ex: 49,90)"
        required: false
        default: ""
      preco_antes:
        description: "Preço antigo (opcional)"
        required: false
        default: ""
      cupom:
        description: "Cupom (opcional)"
        required: false
        default: ""
      modo:
        description: "Formulário: agora = posta só este produto; guardar = vai pra fila do painel"
        required: false
        default: "agora"
        type: choice
        options: [agora, guardar]
      horario:
        description: "Formulário: quando o post sai. Hora (19) ou dia e hora (2026-11-20T19). Vazio = próximo horário"
        required: false
        default: ""
      cancelar:
        description: "Limpar programação: tudo = cancela tudo que ainda não saiu; ou os códigos separados por vírgula"
        required: false
        default: ""

# Nunca roda duas rodadas ao mesmo tempo (a segunda espera a primeira terminar)
# Rodadas normais: uma de cada vez. O GitHub só guarda UMA rodada esperando por grupo
# (a mais nova substitui a anterior), por isso o "Postar agora / formulário / cancelar" do painel
# ganha um grupo próprio por execução: assim nenhum pedido mandado do painel se perde na fila.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.link != '' || inputs.cancelar != '') && format('postar-painel-{0}', github.run_id) || 'postar' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    env:
      TEM_PAGINA: ${{ secrets.PAGINA_TOKEN != '' }}
      TEM_GERAL: ${{ secrets.TELEGRAM_TOKEN_GERAL != '' }}
      TEM_BF: ${{ secrets.TELEGRAM_TOKEN_BF != '' }}
      LIGAR_GERAL: "nao"          # "sim" pra voltar a rodar o perfil geral
      PERFIL_PEDIDO: ${{ github.event_name == 'schedule' && 'blackfriday' || inputs.perfil || 'todos' }}
    steps:
      # Sempre pega a versão MAIS NOVA (com o histórico da rodada anterior),
      # mesmo se esta rodada ficou esperando na fila.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # ---------------- Perfil Ingrid (fitness) ----------------
      - name: Postar ofertas (Ingrid)
        if: env.PERFIL_PEDIDO == 'todos' || env.PERFIL_PEDIDO == 'ingrid'
        continue-on-error: true
        env:
          PERFIL: ingrid
          OFERTA_LINK: ${{ inputs.perfil == 'ingrid' && inputs.link || '' }}
          OFERTA_NOME: ${{ inputs.perfil == 'ingrid' && inputs.nome || '' }}
          OFERTA_PRECO: ${{ inputs.perfil == 'ingrid' && inputs.preco || '' }}
          OFERTA_PRECO_ANTES: ${{ inputs.perfil == 'ingrid' && inputs.preco_antes || '' }}
          OFERTA_CUPOM: ${{ inputs.perfil == 'ingrid' && inputs.cupom || '' }}
          OFERTA_MODO: ${{ inputs.perfil == 'ingrid' && inputs.modo || '' }}
          OFERTA_HORARIO: ${{ inputs.perfil == 'ingrid' && inputs.horario || '' }}
          OFERTA_CANCELAR: ${{ inputs.perfil == 'ingrid' && inputs.cancelar || '' }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          TELEGRAM_MEU_CHAT: ${{ secrets.TELEGRAM_MEU_CHAT }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          WHATSAPP_GRUPO: ${{ secrets.WHATSAPP_GRUPO }}
          GREEN_ID: ${{ secrets.GREEN_ID }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN }}
          GREEN_URL: ${{ secrets.GREEN_URL }}
          OFERTAS_POR_RODADA: "2"
          RADAR_MODO: "painel"      # painel | aprovar | auto | desligado
          # 06/11 + 18/11: palavras que o robô busca na Shopee. Moda fitness, moda, beleza e casa.
          SHOPEE_MAIS_VENDIDOS: "4"   # 18/11: palavras buscadas pelos mais vendidos (antes 2)
          SHOPEE_COMISSAO: "2"        # 18/11: palavras buscadas pela maior comissão (antes 1)
          PALAVRAS: "legging fitness cintura alta,legging empina bumbum,conjunto fitness feminino,conjunto legging e top,top academia com bojo,top fitness nadador,short academia feminino,short saia fitness,bermuda ciclista feminina,macaquinho fitness,macacao fitness feminino,regata academia feminina,cropped academia,jaqueta corta vento feminina,sutia esportivo alta sustentacao,meia academia feminina,tenis academia feminino,tenis corrida feminino,bolsa academia feminina,mochila academia,garrafa termica academia,garrafa motivacional 2 litros,coqueteleira,elastico extensor exercicio,kit mini band elastico,tapete yoga,caneleira peso,halter emborrachado,corda de pular,cinta modeladora,body feminino,vestido midi feminino,vestido canelado,blusa feminina basica,calca pantalona feminina,conjunto alfaiataria feminino,sandalia feminina,skincare kit,serum vitamina c,protetor solar facial,hidratante corporal,escova secadora,kit maquiagem,perfume feminino,organizador cozinha,pote hermetico vidro,organizador guarda roupa,utensilios cozinha silicone,toalha de banho,jogo de cama casal,calca wide leg,saia midi,cropped feminino,pijama feminino,bolsa transversal,brinco feminino,oculos de sol feminino,base liquida,paleta de sombra,batom matte,mascara de cilios,chapinha prancha,body splash,organizador de gaveta,copo termico,tapete sala,luminaria led,difusor de aromas,porta temperos,cabide veludo,caixa organizadora,mop giratorio"
          # 30/10: + ofertasEcuponsSheinBR (teste de canal da Shein; se der "0 posts lidos" no log, tirar)
          RADAR_CANAIS: "urubupromo,pobregram,pelandobr,promotop,Postou_Achou,fitcomestilo_ofertas,ofertafitness,grupodeachadinhos,achadinhosdavava,achadoscasaedecor,achadosfitnessbr,achadosshopebrasil,guerradealsfit,ofertasEcuponsSheinBR"
        run: python bot.py

      # ---------------- Perfil Geral (achadinhos em geral) ----------------
      # Segredos próprios terminados em _GERAL. Os que não existirem usam os da Ingrid
      # (Shopee, Amazon, Green-API e seu chat do Telegram podem ser os mesmos).
      - name: Postar ofertas (Geral)
        if: env.LIGAR_GERAL == 'sim' && (env.PERFIL_PEDIDO == 'todos' || env.PERFIL_PEDIDO == 'geral') && env.TEM_GERAL == 'true'
        continue-on-error: true
        env:
          PERFIL: geral
          OFERTA_CANCELAR: ${{ inputs.perfil == 'geral' && inputs.cancelar || '' }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_GERAL }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL_GERAL }}
          TELEGRAM_MEU_CHAT: ${{ secrets.TELEGRAM_MEU_CHAT_GERAL || secrets.TELEGRAM_MEU_CHAT }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG_GERAL || secrets.AMAZON_TAG }}
          WHATSAPP_GRUPO: ${{ secrets.WHATSAPP_GRUPO_GERAL }}
          GREEN_ID: ${{ secrets.GREEN_ID_GERAL || secrets.GREEN_ID }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN_GERAL || secrets.GREEN_TOKEN }}
          GREEN_URL: ${{ secrets.GREEN_URL_GERAL || secrets.GREEN_URL }}
          OFERTAS_POR_RODADA: "3"
          RADAR_MODO: "automatico"  # posta sozinho o que já tem o link de vocês; o resto fica no painel
          RADAR_NICHO: "tudo"
          CATEGORIAS_FORA: "Eletrodomésticos,Eletrônicos"   # eletro vai pro grupo de eletro
          PALAVRAS: "organizador casa,utensilios cozinha,garrafa termica,kit ferramentas,luminaria led,mochila,perfume,brinquedo infantil,toalha de banho,jogo de cama,pote hermetico,kit maquiagem,tapete sala,mala de viagem,suporte celular"
          RADAR_CANAIS: "urubupromo,pobregram,pelandobr,promotop,Postou_Achou,grupodeachadinhos,achadosshopebrasil,achadoscasaedecor"
        run: python bot.py

      # ---------------- Perfil Black Friday ----------------
      - name: Postar ofertas (Black Friday)
        if: (env.PERFIL_PEDIDO == 'todos' || env.PERFIL_PEDIDO == 'blackfriday') && env.TEM_BF == 'true'
        continue-on-error: true
        env:
          PERFIL: blackfriday
          OFERTA_LINK: ${{ inputs.perfil == 'blackfriday' && inputs.link || '' }}
          OFERTA_NOME: ${{ inputs.perfil == 'blackfriday' && inputs.nome || '' }}
          OFERTA_PRECO: ${{ inputs.perfil == 'blackfriday' && inputs.preco || '' }}
          OFERTA_PRECO_ANTES: ${{ inputs.perfil == 'blackfriday' && inputs.preco_antes || '' }}
          OFERTA_CUPOM: ${{ inputs.perfil == 'blackfriday' && inputs.cupom || '' }}
          OFERTA_MODO: ${{ inputs.perfil == 'blackfriday' && inputs.modo || '' }}
          OFERTA_HORARIO: ${{ inputs.perfil == 'blackfriday' && inputs.horario || '' }}
          OFERTA_CANCELAR: ${{ inputs.perfil == 'blackfriday' && inputs.cancelar || '' }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BF }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL_BF }}
          TELEGRAM_MEU_CHAT: ${{ secrets.TELEGRAM_MEU_CHAT_BF || secrets.TELEGRAM_MEU_CHAT }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG_BF || secrets.AMAZON_TAG }}
          WHATSAPP_GRUPO: ${{ secrets.WHATSAPP_GRUPO_BF }}
          GREEN_ID: ${{ secrets.GREEN_ID_BF || secrets.GREEN_ID }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN_BF || secrets.GREEN_TOKEN }}
          GREEN_URL: ${{ secrets.GREEN_URL_BF || secrets.GREEN_URL }}
          OFERTAS_POR_RODADA: "1"    # 05/11: teste um post por hora (antes: 5)
          # 05/11: nas rodadas automáticas (GitHub e cron-job.org) sai só 1 post por rodada;
          # o resto da fila espera a próxima hora. O botão "Enviar agora" do painel (perfil blackfriday)
          # continua soltando até 5. Pra desfazer o teste: troque tudo isso por "5".
          MAX_TOTAL_RODADA: ${{ inputs.perfil == 'blackfriday' && '5' || '1' }}
          RADAR_MODO: "painel"      # 28/10: nada sai sozinho; o robô garimpa e o Yuri escolhe no painel
          LEMBRETE_PAINEL: "sim"    # avisa no Telegram quando tiver achado novo pra escolher
          RADAR_NICHO: "tudo"
          DESCONTO_GARIMPO: "25"    # só entra no garimpo o que tiver 25% OFF ou mais (Yuri ajustou em 25/10)
          # 28/10 17h30: painel volta a mostrar todas as categorias; o Yuri escolhe o que vai pro grupo.
          # (pra voltar a ser só eletro: CATEGORIAS_GARIMPO: "Eletrodomésticos,Eletrônicos")
          CATEGORIAS_PRIORIDADE: "Eletrodomésticos,Eletrônicos"   # eletrodomésticos saem primeiro
          # PRECO_MINIMO: "80"      # 28/10 18h: tirado, o Yuri escolhe tudo no painel
          AMAZON_CHECAR_DESCONTO: "sim"   # quando o canal não diz o preço antigo, olha o desconto na página da Amazon
          # Grupos de WhatsApp que o número do robô lê como fonte (formato Nome=codigo@g.us). Fica no segredo RADAR_GRUPOS_ZAP.
          RADAR_GRUPOS_ZAP: ${{ secrets.RADAR_GRUPOS_ZAP }}
          # 06/11: palavras mais específicas (ex.: "fritadeira air fryer 5 litros" em vez de "air fryer",
          # que trazia só forminha). 18/11: + eletro, games e casa.
          SHOPEE_MAIS_VENDIDOS: "4"   # 18/11: palavras buscadas pelos mais vendidos (antes 2)
          SHOPEE_COMISSAO: "2"        # 18/11: palavras buscadas pela maior comissão (antes 1)
          PALAVRAS: "fritadeira air fryer 5 litros,air fryer oven forno eletrico,smart tv 50 polegadas,smart tv 43 polegadas,fone bluetooth jbl,fone de ouvido sem fio,smartwatch feminino,smartwatch masculino,celular xiaomi redmi,tablet android,notebook,aspirador robo,aspirador de po vertical,cafeteira expresso,cafeteira dolce gusto,liquidificador alta potencia,mixer de mao,batedeira planetaria,panela eletrica de arroz,panela de pressao eletrica,sanduicheira grill,micro-ondas 20 litros,purificador de agua,ventilador de coluna,climatizador de ar,secador de cabelo profissional,chapinha prancha cabelo,escova secadora,barbeador eletrico,caixa de som bluetooth,soundbar,carregador turbo celular,power bank,camera de seguranca wifi,lampada inteligente wifi,mouse e teclado sem fio,jogo de panelas antiaderente,jogo de facas inox,jogo de cama queen,edredom casal,travesseiro nasa,mala de viagem media,mochila notebook,perfume importado feminino,perfume importado masculino,kit maquiagem completo,tenis corrida masculino,tenis feminino casual,brinquedo educativo infantil,boneca infantil,carrinho controle remoto,chaleira eletrica,ferro de passar a vapor,echo dot alexa,kindle,smart tv 32 polegadas,monitor gamer,headset gamer,cadeira gamer,mini processador eletrico,forno eletrico 45 litros,garrafa termica inox,kit skincare,toalha de banho jogo,mala de bordo,blocos de montar,patinete eletrico,ring light"
          # Só canais que o robô consegue ler (os que davam "0 posts lidos" saíram em 24/10).
          # Eletro/casa: gtOFERTAS, promo_imperdivel, vrlofertas, ctofertaseletroetv (CT Ofertas Eletro e TV),
          # ofertas_harpyja (eletroportáteis Amazon), escolhasegura, cacadoresofertas, cupons_desconto (Promobit)
          # 28/10 18h: voltaram todos os canais (painel cheio; o Yuri escolhe o que vai pro grupo).
          # 28/10 18h40: saiu descontos_top: os links dele do ML/Shopee abrem a vitrine do canal, não o produto.
          RADAR_CANAIS: "urubupromo,pobregram,pelandobr,promotop,Postou_Achou,grupodeachadinhos,achadosshopebrasil,achadoscasaedecor,guerradealsfit,nerdofertas,cuponsjersu,promocoesecuponsglobais,gtOFERTAS,promo_imperdivel,vrlofertas,ctofertaseletroetv,ofertas_harpyja,escolhasegura,cacadoresofertas,cupons_desconto"
        run: python bot.py

      - name: Guardar histórico (evita repetir oferta)
        if: always()
        # 07/11: antes, quando várias rodadas salvavam ao mesmo tempo (ex.: vários "Programar"
        # seguidos no painel), a última passava por cima das outras e a fila de programados sumia.
        # Agora o robô JUNTA a fila (ofertas.csv) e o histórico com o que já está salvo, sem apagar nada.
        # 18/11: a fila é juntada pelo CÓDIGO de cada programação (fila_id). Antes era pelo link, e uma
        # programação nova de um produto que já tinha saído virava "postada" ao juntar com a linha velha.
        run: |
          git config user.name "achadinhos-bot"
          git config user.email "bot@users.noreply.github.com"
          mudados=$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } \
                     | grep -E '(^|/)(historico\.json|ofertas\.csv|vitrine\.json|garimpo\.json)$' | sort -u || true )
          if [ -z "$mudados" ]; then echo "nada novo pra salvar"; exit 0; fi
          echo "arquivos desta rodada: $mudados"
          rm -rf /tmp/meus && mkdir -p /tmp/meus
          for f in $mudados; do mkdir -p "/tmp/meus/$(dirname "$f")"; cp "$f" "/tmp/meus/$f"; done
          cat > /tmp/juntar.py <<'EOF'
          import csv, json, os, shutil, sys
          salvos, arquivos = sys.argv[1], sys.argv[2:]

          def ler_csv(p):
              if not os.path.exists(p) or os.path.getsize(p) == 0:
                  return [], []
              with open(p, encoding="utf-8") as f:
                  r = csv.DictReader(f)
                  return list(r.fieldnames or []), list(r)

          def chave(l):
              # cada programação tem seu código; linha antiga (sem código) = link + dia/hora
              fid = (l.get("fila_id") or "").strip()
              return "id:" + fid if fid else "l:" + (l.get("link") or "").strip() + "|" + (l.get("quando") or "").strip()

          def situacao(*valores):
              v = {(x or "").strip().lower() for x in valores}
              return "sim" if "sim" in v else "cancelado" if "cancelado" in v else ""

          pastas = set()
          for f in arquivos:
              meu = os.path.join(salvos, f)
              if not os.path.exists(meu):
                  continue
              pastas.add(os.path.dirname(f))
              if f.endswith("ofertas.csv"):
                  c1, deles = ler_csv(f)
                  c2, meus = ler_csv(meu)
                  campos = c1 + [c for c in c2 if c not in c1]
                  fila, ordem = {}, []
                  for l in deles + meus:
                      if not (l.get("link") or "").strip():
                          continue
                      k = chave(l)
                      if k not in fila:
                          fila[k] = dict(l)
                          ordem.append(k)
                          continue
                      atual = fila[k]
                      fim = situacao(atual.get("postado"), l.get("postado"))
                      atual.update({c: v for c, v in l.items() if v})
                      atual["postado"] = fim
                  with open(f, "w", encoding="utf-8", newline="") as s:
                      w = csv.DictWriter(s, fieldnames=campos, extrasaction="ignore")
                      w.writeheader()
                      w.writerows(fila[k] for k in ordem)
                  print(f"[juntar] {f}: {len(deles)} já salvas + {len(meus)} desta rodada = {len(ordem)}")
              elif f.endswith("historico.json"):
                  try:
                      deles = json.load(open(f, encoding="utf-8"))
                  except Exception:
                      deles = {}
                  meus = json.load(open(meu, encoding="utf-8"))
                  for k, v in deles.items():
                      m = meus.get(k)
                      if k not in meus:
                          meus[k] = v
                      elif isinstance(v, (int, float)) and isinstance(m, (int, float)):
                          meus[k] = max(v, m)
                      elif isinstance(v, list) and isinstance(m, list):
                          meus[k] = (v + [x for x in m if x not in v])[-500:]
                  with open(f, "w", encoding="utf-8") as s:
                      json.dump(meus, s, indent=1)
              else:
                  shutil.copyfile(meu, f)

          # Lista "Programados" do painel = o que está na fila e ainda não saiu nem foi cancelado
          for p in pastas:
              csv_p, gar_p = os.path.join(p, "ofertas.csv"), os.path.join(p, "garimpo.json")
              if not (os.path.exists(csv_p) and os.path.exists(gar_p)):
                  continue
              try:
                  dados = json.load(open(gar_p, encoding="utf-8"))
              except Exception:
                  continue
              agenda = []
              for l in ler_csv(csv_p)[1]:
                  if not (l.get("link") or "").strip() or (l.get("postado") or "").strip().lower() in ("sim", "cancelado"):
                      continue
                  try:
                      preco = float((l.get("preco") or "0").replace(",", "."))
                  except ValueError:
                      preco = 0
                  agenda.append({"produto": (l.get("produto") or "").strip(), "loja": (l.get("loja") or "").strip() or "Oferta",
                                 "preco": preco, "quando": (l.get("quando") or "").strip(),
                                 "fila_id": (l.get("fila_id") or "").strip()})
              dados["agenda"] = agenda
              with open(gar_p, "w", encoding="utf-8") as s:
                  json.dump(dados, s, ensure_ascii=False, indent=1)
              print(f"[juntar] {gar_p}: {len(agenda)} programado(s) na lista do painel")
          EOF
          # Tenta salvar até 5 vezes: pega o que já está salvo, junta com esta rodada e envia.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 /tmp/juntar.py /tmp/meus $mudados
            for f in historico.json ofertas.csv vitrine.json garimpo.json; do if [ -f "$f" ]; then git add "$f"; fi; done
            if [ -d perfis ]; then git add perfis; fi
            if git diff --cached --quiet; then echo "nada novo pra salvar"; break; fi
            git commit -q -m "histórico de postagens" && git push origin HEAD:main && break
            echo "não consegui salvar o histórico (tentativa $i), tentando de novo..."
            sleep $((i * 5))
          done

      # Atualiza a página e os painéis (repositório público "grupo").
      # Ingrid: raiz do site. Outros perfis: pasta com o nome do perfil (geral/, blackfriday/).
      # Só roda se o segredo PAGINA_TOKEN existir; se falhar, não atrapalha as postagens.
      - name: Abrir repositório da página
        if: always() && env.TEM_PAGINA == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: achadosindy-web/grupo
          token: ${{ secrets.PAGINA_TOKEN }}
          path: pagina
      - name: Publicar vitrine e garimpo
        if: always() && env.TEM_PAGINA == 'true'
        continue-on-error: true
        run: |
          for f in vitrine.json garimpo.json; do if [ -f "$f" ]; then cp "$f" pagina/; fi; done
          for d in perfis/*/; do
            [ -d "$d" ] || continue
            nome=$(basename "$d"); mkdir -p "pagina/$nome"
            for f in vitrine.json garimpo.json; do if [ -f "$d$f" ]; then cp "$d$f" "pagina/$nome/"; fi; done
          done
          cd pagina
          git config user.name "achadinhos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "vitrine e garimpo atualizados" && git push)
